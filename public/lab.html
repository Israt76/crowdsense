<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowdSense test room</title><style>body{margin:0;background:#1a1240;color:#ece9f8;font:16px/1.5 "Archivo",system-ui,sans-serif}main{max-width:520px;margin:0 auto;padding:28px 18px}h1{font-size:24px;margin:0 0 6px}p{color:#b9b3d6;margin:0 0 20px}label{display:block;font-weight:700;font-size:13px;color:#a49dc8;margin:14px 0 6px}input{width:100%;box-sizing:border-box;font:inherit;padding:12px;border-radius:12px;border:1px solid #3a3070;background:#120c2b;color:#fff}button{margin-top:12px;font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 20px;background:#2de1c2;color:#0b2a25;cursor:pointer}</style></head><body><main><h1>Talk to the stream</h1><p>Type whatever you would type in chat, in your own words. There are no commands.</p><form id="f"><label for="name">Your name or nickname</label><input id="name" required maxlength="32" autocomplete="nickname"><label for="text">Message</label><input id="text" required maxlength="300" autocomplete="off" placeholder="e.g. left looks safer"><button>Send</button></form><div id="log" aria-live="polite"></div></main><script>const name=document.getElementById('name');name.value=localStorage.getItem('cs-name')||'';document.getElementById('f').onsubmit=async(e)=>{e.preventDefault();localStorage.setItem('cs-name',name.value);const text=document.getElementById('text');const token=new URLSearchParams(location.search).get('token');const r=await fetch('/api/message',{method:'POST',headers:{'content-type':'application/json',...(token?{'x-panel-token':token}:{})},body:JSON.stringify({name:name.value,text:text.value})});document.getElementById('log').textContent=r.ok?`Sent: “${text.value}”`:'Could not send. Is the server running in lab mode?';text.value='';text.focus();};</script></body></html>
