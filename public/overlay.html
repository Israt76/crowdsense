<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowdSense overlay</title><link rel="stylesheet" href="/overlay.css"><style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}#stage{position:fixed;inset:0}body.preview{background:repeating-conic-gradient(#2a2a35 0 25%,#33333f 0 50%) 0 0/32px 32px}</style></head>
<body><div id="stage" aria-live="polite"></div><script type="module">import{Overlay}from'/overlay.js';if(new URLSearchParams(location.search).get('bg'))document.body.classList.add('preview');const overlay=new Overlay(document.getElementById('stage'));const es=new EventSource('/events');es.addEventListener('state',e=>overlay.update(JSON.parse(e.data)));</script></body></html>
