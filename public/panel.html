<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowdSense panel</title><link rel="stylesheet" href="/panel.css"><style>body{margin:0;background:#1a1240;min-height:100vh}main{max-width:380px;padding:18px 16px}h1{font:900 18px "Archivo",system-ui,sans-serif;color:#f7f6fb;margin:0 0 2px}.src{font:12px system-ui,sans-serif;color:#8e87b5;margin-bottom:16px}</style></head>
<body><main><h1>CrowdSense</h1><div class="src" id="src">Connecting…</div><div class="panel" id="panel"></div></main><script type="module">import{mountPanel}from'/panel.js';const panel=mountPanel(document.getElementById('panel'));const es=new EventSource('/events');es.addEventListener('state',e=>{const s=JSON.parse(e.data);panel.update(s);document.getElementById('src').textContent=`${s.status.source}${s.status.connected?'':' (reconnecting…)'} · ${s.room} active chatters`;});</script></body></html>
